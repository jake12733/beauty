      .meridian-btn {
        position: relative;
        overflow: hidden;
        isolation: isolate;
        transition:

          box-shadow 0.25s cubic-bezier(0.22, 1, 0.36, 1),
          color 0.35s cubic-bezier(0.16, 1, 0.3, 1),
          border-color 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .meridian-btn::before {
        content: "";
        position: absolute;
        inset: 0;
        background-color: var(--curtain-bg, #1c1917);
        transform: translateY(102%);
        transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1);
        z-index: -1;
      }

      .meridian-btn:hover {
        transform: translateY(-4px);
        box-shadow: 0 16px 32px -12px rgba(18, 16, 15, 0.35);
      }

      .meridian-btn:hover::before {
        transform: translateY(0%);
      }

      .meridian-btn .meridian-arrow {
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .meridian-btn:hover .meridian-arrow {
        transform: rotate(-45deg);
      }

      .nav-link-underline {
        position: relative;
        transition:
          transform 0.25s cubic-bezier(0.22, 1, 0.36, 1),
          color 0.25s cubic-bezier(0.22, 1, 0.36, 1);
      }

      .nav-link-underline::after {
        content: "";
        position: absolute;
        right: 0;
        bottom: -4px;
        left: 0;
        height: 1px;
        background-color: currentColor;
        transform: scaleX(0);
        transform-origin: right center;
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .nav-link-underline:hover,
      .nav-link-underline.is-active {
        transform: translateY(-1px);
      }

      .nav-link-underline:hover::after,
      .nav-link-underline.is-active::after {
        transform: scaleX(1);
        transform-origin: left center;
      }

      @keyframes meridian-marquee {
        from {
          transform: translateX(0);
        }
        to {
          transform: translateX(-50%);
        }
      }

      .marquee-track {
        display: flex;
        width: max-content;
        animation: meridian-marquee 34s linear infinite;
      }

      .marquee-wrapper:hover .marquee-track {
        animation-play-state: paused;
      }

      .marquee-mask {
        -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent);

      }

      @media (hover: none), (pointer: coarse) {
        .solstice-cursor {

        }
        .hover-lift:hover,
        .hover-card-lift:hover,
        .meridian-btn:hover {
          transform: none;
          box-shadow: none;
        }
      }

          scroll-behavior: auto;

          animation: none !important;
        }

        .hover-card-lift,
        .meridian-btn,
        .meridian-btn::before,

        .nav-link-underline,
        .nav-link-underline::after {

        .hover-lift:hover,

        .hover-card-lift:hover,
        .meridian-btn:hover,
        .nav-link-underline:hover {

        .meridian-btn:hover::before {
          transform: translateY(102%) !important;
        }
        .meridian-btn:hover .meridian-arrow {
          transform: none !important;
        }

      /* ================= CUSTOM CURSOR & SCROLL PROGRESS ================= */
      function CustomCursor() {
        const ringRef = useRef(null);
        const dotRef = useRef(null);
        const [label, setLabel] = useState("");
        const [isHoveringInteractive, setIsHoveringInteractive] = useState(false);
        const [isOnDark, setIsOnDark] = useState(true);
        const [isVisible, setIsVisible] = useState(false);

        useEffect(() => {
          const canHover = window.matchMedia("(hover: hover) and (pointer: fine)").matches;
          const reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          if (!canHover || reduced) return;

          let mouseX = window.innerWidth / 2;
          let mouseY = window.innerHeight / 2;
          let ringX = mouseX;
          let ringY = mouseY;
          let rafId = 0;

          const handleMove = (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
            setIsVisible(true);
            if (dotRef.current) {
              dotRef.current.style.transform = `translate3d(${mouseX}px, ${mouseY}px, 0) translate(-50%, -50%)`;
            }
            const target = e.target;
            if (!target) return;
            const cursorLabeled = target.closest("[data-cursor]");
            setLabel(cursorLabeled?.dataset?.cursor || "");
            setIsHoveringInteractive(Boolean(target.closest("a, button, label, select, input, textarea")));
            setIsOnDark(Boolean(target.closest('[data-dark-surface="true"]')));
          };

          const handleLeave = () => setIsVisible(false);

          const animateRing = () => {
            ringX += (mouseX - ringX) * 0.16;
            ringY += (mouseY - ringY) * 0.16;
            if (ringRef.current) {
              ringRef.current.style.transform = `translate3d(${ringX}px, ${ringY}px, 0) translate(-50%, -50%)`;
            }
            rafId = requestAnimationFrame(animateRing);
          };

          window.addEventListener("mousemove", handleMove, { passive: true });
          document.addEventListener("mouseleave", handleLeave);
          rafId = requestAnimationFrame(animateRing);
          return () => {
            window.removeEventListener("mousemove", handleMove);
            document.removeEventListener("mouseleave", handleLeave);
            cancelAnimationFrame(rafId);
          };
        }, []);

        const hasLabel = label.length > 0;
        return (
          <>
            <div
              ref={dotRef}
              aria-hidden="true"
              className={`solstice-cursor pointer-events-none fixed top-0 left-0 z-[70] h-1.5 w-1.5 rounded-full transition-opacity duration-200 ${
                isVisible && !hasLabel ? "opacity-90" : "opacity-0"
              } ${isOnDark ? "bg-[#FAF7F2]" : "bg-[#1C1917]"}`}
            />
            <div
              ref={ringRef}
              aria-hidden="true"
              className={`solstice-cursor pointer-events-none fixed top-0 left-0 z-[70] flex items-center justify-center rounded-full transition-[width,height,background-color,border-color,opacity] duration-300 ${
                !isVisible ? "opacity-0" : "opacity-100"
              } ${
                hasLabel
                  ? "h-20 w-20 border border-[#C85A62]/90 bg-[#9E3E44]/95 text-[#FAF7F2] shadow-xl backdrop-blur-xs"
                  : isHoveringInteractive
                    ? `h-12 w-12 border ${isOnDark ? "border-[#FAF7F2]/60 bg-white/5" : "border-[#1C1917]/50 bg-black/5"}`
                    : `h-8 w-8 border ${isOnDark ? "border-[#FAF7F2]/30" : "border-[#1C1917]/25"}`
              }`}
            >
              {hasLabel && (
                <span className="font-mono-code text-[10px] font-medium tracking-[0.14em] uppercase">
                  {label}
                </span>
              )}
            </div>
          </>
        );
      }

      function ScrollProgress() {
        const [progress, setProgress] = useState(0);

        useEffect(() => {
          const onScroll = () => {
            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            setProgress(docHeight > 0 ? Math.min(1, Math.max(0, window.scrollY / docHeight)) : 0);
          };
          onScroll();
          window.addEventListener("scroll", onScroll, { passive: true });
          return () => window.removeEventListener("scroll", onScroll);
        }, []);

        return (
          <div
            aria-hidden="true"
            style={{ transform: `scaleX(${progress})` }}
            className="pointer-events-none fixed top-0 right-0 left-0 z-50 h-[2px] origin-left bg-[#C85259] transition-transform duration-75"
          />
        );
      }

        const [selectedShades, setSelectedShades] = useState(() => {
          const initial = {};
          CURATION_PRODUCTS.forEach((p) => {
            if (p.shades[0]) initial[p.id] = p.shades[0].id;
          });
          return initial;
        });

        const filterTabs = [
          { key: "all", label: "전체", count: CURATION_PRODUCTS.length },
          { key: "lip", label: "립 메이크업", count: CURATION_PRODUCTS.filter((p) => p.curationCategory === "lip").length },
          { key: "eye-base", label: "아이 · 베이스", count: CURATION_PRODUCTS.filter((p) => p.curationCategory === "eye-base").length },
          { key: "skincare", label: "스킨케어", count: CURATION_PRODUCTS.filter((p) => p.curationCategory === "skincare").length },
          { key: "brush-scent", label: "브러시 · 센트", count: CURATION_PRODUCTS.filter((p) => p.curationCategory === "brush-scent").length },
        ];

        const toggleWishlist = (productId) => {
          setWishlistIds((prev) =>
            prev.includes(productId) ? prev.filter((id) => id !== productId) : [...prev, productId]
          );
        };

        const filteredProducts = useMemo(() => {
          const query = searchQuery.trim().toLowerCase();
          return CURATION_PRODUCTS.filter((product) => {
            if (activeCategory !== "all" && product.curationCategory !== activeCategory) return false;
            if (showWishlistOnly && !wishlistIds.includes(product.id)) return false;
            if (!query) return true;
            return (
              product.name.toLowerCase().includes(query) ||
              product.categoryTag.toLowerCase().includes(query) ||
              product.shades.some((s) => s.name.toLowerCase().includes(query))
            );
          });

          const updateScroll = () => {
            if (!containerRef.current || !stickyRef.current || !trackRef.current) return;
            const rect = containerRef.current.getBoundingClientRect();
            const scrollable = containerRef.current.offsetHeight - window.innerHeight;
            if (scrollable <= 0) return;

            const raw = Math.min(1, Math.max(0, -rect.top / scrollable));
            const normalized = Math.min(1, Math.max(0, (raw - 0.02) / 0.9));
            const maxShift = Math.max(0, trackRef.current.scrollWidth - stickyRef.current.clientWidth);

            setShiftPx(-normalized * maxShift);
            setProgress(normalized);
            setActiveIndex(Math.min(4, Math.max(1, Math.floor(normalized * 3.99) + 1)));
          };

          updateScroll();
          window.addEventListener("scroll", updateScroll, { passive: true });
          window.addEventListener("resize", updateScroll);
          return () => {
            window.removeEventListener("scroll", updateScroll);
            window.removeEventListener("resize", updateScroll);
          };
        }, []);

                        onClose();
                      }}
                      className="shrink-0 cursor-pointer whitespace-nowrap rounded-lg bg-[#9E3E44] px-5 py-3 text-xs font-medium text-[#FAF7F2] transition-colors hover:bg-[#853137]"
                    >
                      장바구니 담기
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      const FREE_SHIPPING_THRESHOLD = 50000;
      const FREE_GIFT_THRESHOLD = 100000;

      function CartDrawer({ isOpen, items, onClose, onUpdateQty, onRemoveItem, onClearCart }) {
        const [orderSubmitted, setOrderSubmitted] = useState(false);

        if (!isOpen) return null;

        const subtotal = items.reduce((sum, item) => sum + item.product.price * item.quantity, 0);
        const shippingFee = subtotal === 0 || subtotal >= FREE_SHIPPING_THRESHOLD ? 0 : 3000;
        const total = subtotal + shippingFee;
        const remainingForFreeShipping = Math.max(0, FREE_SHIPPING_THRESHOLD - subtotal);
        const remainingForGift = Math.max(0, FREE_GIFT_THRESHOLD - subtotal);
        const giftProgress = Math.min(100, (subtotal / FREE_GIFT_THRESHOLD) * 100);

        const handleCloseDrawer = () => {
          setOrderSubmitted(false);
          onClose();
        };

        return (
          <div
            role="dialog"
            aria-modal="true"
            aria-label="장바구니"
            className="fixed inset-0 z-50 flex justify-end bg-black/55 backdrop-blur-xs"
            onClick={handleCloseDrawer}
          >
            <div
              onClick={(e) => e.stopPropagation()}
              className="flex h-full w-full max-w-md flex-col bg-[#FAF8F5] text-[#1C1917] shadow-2xl"
            >
              <div className="flex items-center justify-between border-b border-[#E5DFD6] px-4 py-4 sm:px-6 sm:py-5">
                <div>
                  <h2 className="font-serif-kr text-lg font-semibold text-[#1C1917]">장바구니</h2>
                  <p className="text-[11px] text-[#7D746B] sm:text-xs">
                    ₩50,000 무료 배송 · ₩100,000 아틀리에 미니 파우치 증정
                  </p>
                </div>
                <button
                  type="button"
                  onClick={handleCloseDrawer}
                  aria-label="장바구니 닫기"
                  className="flex h-9 w-9 shrink-0 cursor-pointer items-center justify-center rounded-lg border border-[#E5DFD6] text-[#1C1917] transition-colors hover:bg-[#EFEAE2]"
                >
                  <X className="h-4 w-4" />
                </button>
              </div>

              <div className="flex-1 overflow-y-auto px-4 py-4 sm:px-6 sm:py-5">
                {orderSubmitted ? (
                  <div className="flex h-full flex-col items-center justify-center text-center">
                    <CheckCircle2 className="h-12 w-12 text-[#9E3E44]" />
                    <h3 className="font-serif-kr mt-4 text-xl font-semibold text-[#1C1917]">주문이 접수되었습니다</h3>
                    <p className="mt-2 max-w-xs text-sm leading-relaxed text-[#625A53]">
                      솔스티스 뷰티 아틀리에에서 정성스럽게 포장하여 빠르게 발송해드리겠습니다.
                    </p>
                    <button
                      type="button"
                      onClick={handleCloseDrawer}
                      className="mt-6 cursor-pointer rounded-lg bg-[#1C1917] px-6 py-3 text-xs font-medium text-[#FAF8F5] transition-colors hover:bg-[#332E2B]"
                    >
                      쇼핑 계속하기
                    </button>
                  </div>
                ) : items.length === 0 ? (
                  <div className="flex h-full flex-col items-center justify-center text-center">
                    <p className="text-sm text-[#7D746B]">장바구니에 담긴 상품이 없습니다.</p>
                    <button
                      type="button"
                      onClick={handleCloseDrawer}
                      className="mt-4 cursor-pointer rounded-lg border border-[#1C1917] px-5 py-2.5 text-xs font-medium text-[#1C1917] transition-colors hover:bg-[#1C1917] hover:text-white"
                    >
                      컬렉션 둘러보기
                    </button>
                  </div>
                ) : (
                  <div className="space-y-4">
                    <div className="rounded-xl border border-[#E5DFD6] bg-white p-4">
                      <div className="flex items-center justify-between gap-2 text-xs text-[#575049]">
                        {remainingForFreeShipping > 0 ? (
                          <span>
                            <strong className="font-mono-code font-semibold text-[#9E3E44]">
                              {formatKRW(remainingForFreeShipping)}
                            </strong>{" "}
                            추가 시 무료 배송
                          </span>
                        ) : remainingForGift > 0 ? (
                          <span>
                            무료 배송 충족 ·{" "}
                            <strong className="font-mono-code font-semibold text-[#9E3E44]">
                              {formatKRW(remainingForGift)}
                            </strong>{" "}
                            추가 시 미니 파우치 증정
                          </span>
                        ) : (
                          <span className="flex items-center gap-1.5 font-medium text-[#1C1917]">
                            <Gift className="h-3.5 w-3.5 text-[#9E3E44]" />
                            무료 배송 + 아틀리에 우븐 미니 파우치 증정 적용!
                          </span>
                        )}
                        <span className="font-mono-code text-[10px] tabular-nums text-[#7D746B]">
                          {Math.round(giftProgress)}%
                        </span>
                      </div>

                      <div className="mt-2.5 h-1.5 w-full overflow-hidden rounded-full bg-[#EFEAE2]">
                        <div style={{ width: `${giftProgress}%` }} className="h-full rounded-full bg-[#9E3E44] transition-all duration-300" />
                      </div>
                    </div>

                    {items.map((item) => (
                      <div
                        key={`${item.product.id}-${item.shade.id}`}
                        className="flex gap-4 rounded-xl border border-[#E6E0D7] bg-white p-3.5"
                      >
                        <img
                          src={item.product.image}
                          alt={item.product.name}
                          className="h-20 w-20 shrink-0 rounded-lg bg-[#EAE5DC] object-cover"
                        />

                        <div className="flex min-w-0 flex-1 flex-col justify-between">
                          <div className="flex items-start justify-between gap-2">
                            <div className="min-w-0">
                              <h3 className="truncate text-sm font-semibold text-[#1C1917]">{item.product.name}</h3>
                              <p className="mt-0.5 flex items-center gap-1.5 text-xs text-[#665E57]">
                                <span
                                  className="inline-block h-2.5 w-2.5 rounded-full border border-black/15"
                                  style={{ backgroundColor: item.shade.hex }}
                                />
                                <span>{item.shade.name}</span>
                              </p>
                            </div>

                            <button
                              type="button"
                              onClick={() => onRemoveItem(item.product.id, item.shade.id)}
                              aria-label={`${item.product.name} 삭제`}
                              className="cursor-pointer text-[#9A9086] transition-colors hover:text-[#9E3E44]"
                            >
                              <Trash2 className="h-4 w-4" />
                            </button>
                          </div>

                          <div className="mt-3 flex items-center justify-between">
                            <div className="inline-flex items-center rounded-md border border-[#E0D9CE]">
                              <button
                                type="button"
                                onClick={() => onUpdateQty(item.product.id, item.shade.id, -1)}
                                aria-label="수량 감소"
                                className="cursor-pointer p-1.5 text-[#575049] hover:text-[#1C1917]"
                              >
                                <Minus className="h-3 w-3" />
                              </button>
                              <span className="font-mono-code px-2.5 text-xs tabular-nums text-[#1C1917]">
                                {item.quantity}
                              </span>
                              <button
                                type="button"
                                onClick={() => onUpdateQty(item.product.id, item.shade.id, 1)}
                                aria-label="수량 증가"
                                className="cursor-pointer p-1.5 text-[#575049] hover:text-[#1C1917]"
                              >
                                <Plus className="h-3 w-3" />
                              </button>
                            </div>

                            <span className="font-mono-code text-sm font-medium tabular-nums text-[#1C1917]">
                              {formatKRW(item.product.price * item.quantity)}
                            </span>
                          </div>
                        </div>
                      </div>
                    ))}

                    {remainingForGift === 0 && (
                      <div className="flex items-center justify-between rounded-xl border border-dashed border-[#C85A62]/50 bg-[#FAF1F1] px-4 py-3 text-xs">
                        <div className="flex items-center gap-2.5">
                          <Gift className="h-4 w-4 text-[#9E3E44]" />
                          <span className="font-medium text-[#1C1917]">아틀리에 우븐 미니 파우치 (증정품)</span>
                        </div>
                        <span className="font-mono-code text-[11px] font-semibold text-[#9E3E44]">FREE</span>
                      </div>
                    )}
                  </div>
                )}
              </div>

              {items.length > 0 && !orderSubmitted && (
                <div className="border-t border-[#E5DFD6] bg-white px-4 py-4 sm:px-6 sm:py-5">
                  <div className="space-y-2 text-xs text-[#665E57]">
                    <div className="flex justify-between">
                      <span>상품 금액</span>
                      <span className="font-mono-code tabular-nums">{formatKRW(subtotal)}</span>
                    </div>
                    <div className="flex justify-between">
                      <span>배송비</span>
                      <span className="font-mono-code tabular-nums">
                        {shippingFee === 0 ? "무료" : formatKRW(shippingFee)}
                      </span>
                    </div>
                    <div className="flex justify-between border-t border-[#EFEAE2] pt-2.5 text-sm font-semibold text-[#1C1917]">
                      <span>총 결제 금액</span>
                      <span className="font-mono-code tabular-nums">{formatKRW(total)}</span>
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={() => {
                      setOrderSubmitted(true);
                      onClearCart();
                    }}
                    className="mt-5 w-full cursor-pointer rounded-lg bg-[#9E3E44] py-3.5 text-sm font-medium text-[#FAF7F2] transition-colors hover:bg-[#853137]"
                  >
                    주문하기
                  </button>
                </div>
              )}
            </div>
          </div>
        );
      }

      /* ================= ROOT APP ================= */
      function App() {
        const [selectedFilmProduct, setSelectedFilmProduct] = useState(FILM_HIGHLIGHT_PRODUCTS[0]);
        const [modalState, setModalState] = useState({ product: null });
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [cartItems, setCartItems] = useState([]);

        const totalCartCount = cartItems.reduce((sum, item) => sum + item.quantity, 0);

        const handleOpenShadeModal = (product, initialShadeId) => {
          setModalState({ product, initialShadeId });
        };

        const mergeItemsIntoCart = (incoming) => {
          setCartItems((prev) => {
            const next = [...prev];
            incoming.forEach(({ product, shade }) => {
              const existingIndex = next.findIndex(
                (item) => item.product.id === product.id && item.shade.id === shade.id
              );
              if (existingIndex >= 0) {
                next[existingIndex] = {
                  ...next[existingIndex],
                  quantity: next[existingIndex].quantity + 1,
                };
              } else {
                next.push({ product, shade, quantity: 1 });
              }
            });
            return next;
          });
          setIsCartOpen(true);
        };

        const handleAddToCart = (product, shade) => mergeItemsIntoCart([{ product, shade }]);

        const handleUpdateQty = (productId, shadeId, delta) => {
          setCartItems((prev) =>
            prev
              .map((item) =>
                item.product.id === productId && item.shade.id === shadeId
                  ? { ...item, quantity: item.quantity + delta }
                  : item
              )
              .filter((item) => item.quantity > 0)
          );
        };

        const handleRemoveItem = (productId, shadeId) => {
          setCartItems((prev) =>
            prev.filter((item) => !(item.product.id === productId && item.shade.id === shadeId))
          );
        };

        return (
          <div className="min-h-screen bg-[#FAF8F5] text-[#1C1917]">
            <CustomCursor />
            <ScrollProgress />

            <Navbar cartCount={totalCartCount} onOpenCart={() => setIsCartOpen(true)} />

            <main>
              <HeroSection
                selectedProduct={selectedFilmProduct}
                onSelectProduct={setSelectedFilmProduct}
                onOpenShadeModal={(product) => handleOpenShadeModal(product)}
              />
              <EditorialMarquee />
              <CurationSection onOpenShadeModal={handleOpenShadeModal} />
              <PigmentStudioSection onAddToCart={handleAddToCart} />
              <HorizontalLookbookSection onOpenShadeModal={(product) => handleOpenShadeModal(product)} />
              <VanityTableSection onAddToCart={handleAddToCart} onAddBundleToCart={mergeItemsIntoCart} />
              <AtelierSection />
              <BoutiqueCareSection />
            </main>

            <BoutiqueFooter />

            <ProductModal
              product={modalState.product}
              initialShadeId={modalState.initialShadeId}
              onClose={() => setModalState({ product: null })}
              onAddToCart={handleAddToCart}
            />

            <CartDrawer
              isOpen={isCartOpen}
              items={cartItems}
              onClose={() => setIsCartOpen(false)}
              onUpdateQty={handleUpdateQty}
              onRemoveItem={handleRemoveItem}
              onClearCart={() => setCartItems([])}
            />
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
